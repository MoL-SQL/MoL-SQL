[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mol-sql"
version = "0.1.0"
description = "Reproducible MoL-SQL dataset and experiment pipelines"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "sqlglot>=25,<31",
]

[project.scripts]
mol-sql = "mol_sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
