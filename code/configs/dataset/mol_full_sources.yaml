# Paths are relative to the repository root. To rebuild Full from aligned seeds,
# place the four-cell source dumps under seeds/ (or edit the paths below).
# Packaged releases in data/releases/ do not need these seed directories.
schema_version: mol-full-sources-v0.1
sources:
  - source_family: spider
    release_role: core
    root: seeds/Spider
    native_language: en
    split: dev
    id_field: null
    sql_fields: [query, SQL]
    difficulty_field: null
    upstream_version: Spider 1.0 dev snapshot (README update 2020-08-03)
    source_url: https://github.com/taoyds/spider
    snapshot_date: "2026-07-28"
    license_spdx: Apache-2.0
    license_evidence_url: https://github.com/taoyds/spider/blob/b7b5b8c890cd30e35427348bb9eb8c6d1350ca7c/LICENSE
    redistribution_policy: redistributable_with_attribution
    license_notes: Preserve Spider and cited third-party database attribution notices.
    replacement_proposals: seeds/replacement_configs/spider_replacements.json
    replacement_map: code/configs/dataset/replacements/spider_applied_v0.1.json
    execution_repairs: code/configs/dataset/execution_repairs_v0.1.json
    execution_adjudications: code/configs/dataset/execution_adjudications_v0.1.json
    database_roots:
      en: seeds/Spider/spider_enq_end/database
      zh: seeds/Spider/spider_enq_cnd/database
    variants:
      Q_en--S_en--V_en: {directory: spider_enq_end, question_language: en, schema_language: en, value_language: en}
      Q_zh--S_en--V_en: {directory: spider_cnq_end, question_language: zh, schema_language: en, value_language: en}
      Q_en--S_zh--V_zh: {directory: spider_enq_cnd, question_language: en, schema_language: zh, value_language: zh}
      Q_zh--S_zh--V_zh: {directory: spider_cnq_cnd, question_language: zh, schema_language: zh, value_language: zh}

